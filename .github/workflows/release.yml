name: Release build matrix

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: cd example && flutter pub get && flutter build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.platform }}
          path: example/build/${{ matrix.platform }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd example && flutter pub get && flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: example-web
          path: example/build/web
