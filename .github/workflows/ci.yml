name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test benchmark example/lib example/integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-unit-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-failures
          path: test/failures/**
          if-no-files-found: ignore
      - run: flutter pub publish --dry-run
      - run: flutter test benchmark/large_graph_benchmark_test.dart --reporter expanded
      - uses: actions/upload-artifact@v7
        with:
          name: large-graph-benchmark
          path: benchmark/results.json

  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2
          apt-get install -y --no-install-recommends ca-certificates clang cmake curl git jq libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-9-dev libglu1-mesa ninja-build pkg-config unzip xz-utils xvfb
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Trust the runner-cached Flutter SDK in the container
        run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get
      - run: cd example && flutter pub get && flutter analyze && flutter build linux --release
      - name: Run example app integration test
        run: cd example && xvfb-run -a flutter test integration_test/fflow_editor_test.dart -d linux
      - name: Archive Linux example bundle
        if: success() && github.event_name != 'pull_request'
        run: tar -czf fflow-linux.tar.gz -C example/build/linux/x64/release bundle
      - name: Upload Linux example bundle
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fflow-linux-${{ github.sha }}
          path: fflow-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd example && flutter pub get && flutter analyze && flutter build web --release

  build-desktop:
    # Windows and macOS hosted runners use more of the free allowance than Linux.
    # Keep these builds off pull requests; master pushes and manual runs still produce artifacts.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            artifact_path: example/build/windows/x64/runner/Release/
          - os: macos-15
            platform: macos
            artifact_path: fflow-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd example && flutter pub get && flutter build ${{ matrix.platform }} --release
      - name: Archive macOS app bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd example/build/macos/Build/Products/Release
          tar -czf "$GITHUB_WORKSPACE/fflow-macos.tar.gz" -- *.app
      - name: Upload ${{ matrix.platform }} example bundle
        uses: actions/upload-artifact@v7
        with:
          name: fflow-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
