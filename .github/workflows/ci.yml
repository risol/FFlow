name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test benchmark example/lib
      - run: flutter analyze
      - run: flutter test
      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-failures
          path: test/failures/**
          if-no-files-found: ignore
      - run: flutter pub publish --dry-run
      - run: flutter test benchmark/large_graph_benchmark_test.dart --reporter expanded
      - uses: actions/upload-artifact@v4
        with:
          name: large-graph-benchmark
          path: benchmark/results.json

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: cd example && flutter pub get && flutter build web --release
      - run: cd example && flutter build linux --release
